      - vllm
      - serve
      - /models/MiniMax-H3
      - --omni
      - --task-type
      - ref2va
      - --host
      - 0.0.0.0
      - --port
      - "8002"
      - --trust-remote-code
      - --num-gpus
      - "2"
      - --tensor-parallel-size
      - "2"
      - --usp
      - "1"
      - --ring
      - "1"
      - --text-encoder-tp-size
      - "2"
      - --vae-patch-parallel-size
      - "2"
      - --vae-parallel-mode
      - tile
      - --vae-use-tiling
      - --enable-distributed-layerwise-offload
      - --dlo-no-use-allgather
      - --dlo-resident-layers
      - "24"
      - --enforce-eager
      - --diffusion-attention-backend
      - CUDNN_ATTN

    ports:
      - "8002:8002"

    deploy:
      resources:
        reservations:
          memory: ${H3_VLLM_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              device_ids: ["4", "5"]
              capabilities:
                - gpu

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8002/health').status == 200 else 1)"
        ]
      interval: 300s
      timeout: 10s
      retries: 2
      start_period: 600s

  # ══ 实例 3：GPU 6,7 → :8003 ══════════════════════════════════════════════
  minimax-h3-3:
    <<: *vllm-common
    container_name: minimax-h3-vllm-a100-3

    # 参数与 minimax-h3-0 完全一致，仅 GPU 对 / 端口 / 容器名不同
    command:
      - vllm
      - serve
      - /models/MiniMax-H3
      - --omni
      - --task-type
      - ref2va
      - --host
      - 0.0.0.0
      - --port
      - "8003"
      - --trust-remote-code
      - --num-gpus
      - "2"
      - --tensor-parallel-size
      - "2"
      - --usp
      - "1"
      - --ring
      - "1"
      - --text-encoder-tp-size
      - "2"
      - --vae-patch-parallel-size
      - "2"
      - --vae-parallel-mode
      - tile
      - --vae-use-tiling
      - --enable-distributed-layerwise-offload
      - --dlo-no-use-allgather
      - --dlo-resident-layers
      - "24"
