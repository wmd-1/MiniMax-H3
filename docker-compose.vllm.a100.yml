# MiniMax-H3 (vLLM-Omni)
# 2× NVIDIA A100 40GB
#
# 第一阶段：
# - TP2
# - FL2VA
# - DLO
# - DLO_RESIDENT_LAYERS=24
# - 容器 RAM 硬上限 384G
# - 容器 Swap 硬上限 16G
#
# 24 层不是官方 A100 验证值。
# 官方 2× RTX 5090 32GB profile 为 20 层；
# A100 40GB 需要通过真实 nvidia-smi / RAM / Swap 数据逐档调优。

services:
  minimax-h3:
    image: minimax-h3-vllm:latest
    container_name: minimax-h3-vllm-a100

    ipc: host
    shm_size: 64gb

    restart: unless-stopped

    # ------------------------------------------------------------
    # Container memory / swap ceiling
    #
    # RAM <= 384 GiB
    # RAM + SWAP <= 400 GiB
    # => container SWAP <= 16 GiB
    # ------------------------------------------------------------
    mem_limit: 384g
    memswap_limit: 400g
    mem_swappiness: 10

    mem_reservation: 256g

    command:
      - vllm
      - serve
      - /models/MiniMax-H3

      - --omni
      - --task-type
      - t2va

      - --host
      - 0.0.0.0
      - --port
      - "8000"

      - --trust-remote-code

      # TP2
      - --num-gpus
      - "2"
      - --tensor-parallel-size
      - "2"

      # Ulysses / Ring
      - --usp
      - "1"
      - --ring
      - "1"

      # Text encoder
      - --text-encoder-tp-size
      - "2"

      # VAE
      - --vae-patch-parallel-size
      - "2"
      - --vae-parallel-mode
      - tile
      - --vae-use-tiling

      # DLO
      - --enable-distributed-layerwise-offload
      - --dlo-no-use-allgather

      # A100 第一阶段保守值
      - --dlo-resident-layers
      - "24"

      # 稳定性优先
      - --enforce-eager

      # 官方双卡 RTX profile 使用 CUDNN_ATTN
      # A100 需要实际启动验证兼容性
      - --diffusion-attention-backend
      - CUDNN_ATTN

    ports:
      - "8000:8000"

    volumes:
      - /model_nas/models/MiniMax-H3:/models/MiniMax-H3:ro
      - /data/minimax-h3:/data/minimax-h3:ro

    environment:
      CUDA_VISIBLE_DEVICES: "0,1"
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      VLLM_OMNI_VIDEO_SYNC_TIMEOUT: "14400"

      # 仅作为环境记录，不作为 CLI 参数来源
      DLO_RESIDENT_LAYERS: "24"

      WIDTH: "1344"
      HEIGHT: "768"

      # 生产环境离线运行
      HF_HUB_OFFLINE: "1"

    deploy:
      resources:
        reservations:
          memory: 256g
          devices:
            - driver: nvidia
              count: 2
              capabilities:
                - gpu

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"
        ]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 600s