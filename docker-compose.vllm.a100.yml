# MiniMax-H3 (vLLM-Omni) —— 2× NVIDIA A100 40GB × 4 实例（每实例 TP2 + DLO）
#
# ── 多实例（一进程一实例，一次起 4 个）──────────────────────────────────────
#   minimax-h3-0  GPU 0,1  →  http://<host>:8000   （脚本默认端口，向后兼容）
#   minimax-h3-1  GPU 2,3  →  http://<host>:8001
#   minimax-h3-2  GPU 4,5  →  http://<host>:8002
#   minimax-h3-3  GPU 6,7  →  http://<host>:8003
#   每实例仍是 TP2 + DLO，单卡显存口径与单实例方案完全一致；
#   变的只是宿主机侧资源：RAM / SWAP 上限是「每实例」一份，4 份相加才是总需求。
#     - 默认 mem_limit=384g/实例 → 4 实例合计 1536g，宿主机 RAM 需 ≥ 1.5 TiB；
#     - RAM 不足时用 H3_VLLM_MEM_LIMIT / H3_VLLM_MEMSWAP_LIMIT / H3_VLLM_MEM_RESERVATION
#       统一调小；但 DLO 把 ~130 GiB 权重放在主机内存，单实例 < ~160g 基本必然 OOM，
#       384 GiB 级机器只能起 1 个实例，不能按 1/4 硬切。
#     - ipc: host 时 /dev/shm 就是宿主机的 /dev/shm（shm_size 不生效，保留仅为兼容），
#       4 实例共享同一份，容量由宿主机决定。
#   单独起/重启某个实例：docker compose up -d minimax-h3-1 / docker compose restart minimax-h3-2
#
# 第一阶段（实测基线）：
# - TP2 / Ref2VA / DLO
# - DLO_RESIDENT_LAYERS=24 时：idle 2G，生成峰值 24G/卡（已确认）
# - 容器 RAM 硬上限 384G，Swap 硬上限 16G
#
# A100 40G 逐档调优（线性模型，基于正确基线反推）：
#   基线：vLLM 24 层 → idle 2G / 峰值 24G（用户确认）
#   DiT 每层每卡权重 = 66.3/52/2 = 0.6375 G；非DiT峰值基线 ≈ 24−24×0.6375 = 8.7 G
#   峰值(N) ≈ 8.7 + 0.6375×N  (GB/卡)
#     24→24.0G | 32→29.1G | 40→34.2G(实测~34G,余~6G) |
#     44→36.8G | 46→38.0G(顶配目标,余~2G) | 48→39.3G(几乎无余量) |
#     52→41.9G(超40G,不可行)
#   交叉验证：sglang 40层全常驻=峰值38G，佐证40层全权重装得下但余量小；
#            vLLM 40层(DLO)仅~34G，比 sglang 全常驻少~4G=DLO窗口化收益。
#   用户实测 40 层峰值 ~34G，与模型吻合；现上探 46 层目标 ~38G 峰值（余~2G）。
#   => 安全极限 40(余6G)；顶配 46(余2G,VAE突发需盯峰值)；52 确定超40G不可行。
#   启动后用 nvidia-smi --query-gpu=memory.used --loop=1 抓峰值确认 ≤39G；
#   若 VAE 突发致顶到 40G+ OOM 则回退 44。
#
# 官方 2× RTX 5090 32GB profile 为 20 层；A100 40GB 顶配曾上探 46，
# 本轮 4 实例并行统一收敛到 24（保守，单卡峰值约 24G，留足 VAE 突发余量）。

x-vllm-common: &vllm-common
  # tag 与 Dockerfile.vllm 的 FROM 对齐；旧 :latest 是 2026-08 的旧构建
  image: video-vllm:v0.34.0

  ipc: host
  shm_size: 64gb            # ipc: host 时 /dev/shm 即宿主机 shm，本项不生效，保留仅为兼容

  restart: unless-stopped

  # ------------------------------------------------------------
  # Container memory / swap ceiling（每实例口径）
  #
  # RAM <= 384 GiB
  # RAM + SWAP <= 400 GiB
  # => container SWAP <= 16 GiB
  #
  # 多实例：4 份上限相加 ≈ RAM 1.5 TiB / SWAP 64 GiB，宿主机 RAM 必须跟上（见文件头）。
  # ------------------------------------------------------------
  mem_limit: ${H3_VLLM_MEM_LIMIT:-384g}
  memswap_limit: ${H3_VLLM_MEMSWAP_LIMIT:-400g}
  mem_swappiness: 10

  mem_reservation: ${H3_VLLM_MEM_RESERVATION:-256g}

  volumes:
    - /model_nas/models/MiniMax-H3:/models/MiniMax-H3:ro
    - /data/minimax-h3:/data/minimax-h3:ro

  environment:
    # CUDA_VISIBLE_DEVICES: "0,1"
    VLLM_WORKER_MULTIPROC_METHOD: spawn
    VLLM_OMNI_VIDEO_SYNC_TIMEOUT: "14400"

    # 仅作为环境记录，不作为 CLI 参数来源
    DLO_RESIDENT_LAYERS: "24"

    WIDTH: "1344"
    HEIGHT: "768"

    # 生产环境离线运行
    HF_HUB_OFFLINE: "1"

services:
  # ══ 实例 0：GPU 0,1 → :8000（脚本默认端口，向后兼容）═════════════════════
  minimax-h3-0:
    <<: *vllm-common
    container_name: minimax-h3-vllm-a100-0

    command:
      - vllm
      - serve
      - /models/MiniMax-H3

      - --omni
      - --task-type
      # - t2va
      - ref2va

      - --host
      - 0.0.0.0
      - --port
      - "8000"

      - --trust-remote-code

      # TP2
      - --num-gpus
      - "2"
      - --tensor-parallel-size
      - "2"

      # Ulysses / Ring
      - --usp
      - "1"
      - --ring
      - "1"

      # Text encoder
      - --text-encoder-tp-size
      - "2"

      # VAE
      - --vae-patch-parallel-size
      - "2"
      - --vae-parallel-mode
      - tile
      - --vae-use-tiling

      # DLO
      - --enable-distributed-layerwise-offload
      - --dlo-no-use-allgather

      # 统一取 24（保守值）：24 层实测 idle 2G / 峰值 ~24G/卡，4 实例并行留足余量；
      # A100 顶配可上探 46（估 ~38G、余 ~2G），确认整机稳定后再逐档上调。
      - --dlo-resident-layers
      - "24"

      # 稳定性优先
      - --enforce-eager

      # 官方双卡 RTX profile 使用 CUDNN_ATTN
      # A100 需要实际启动验证兼容性
      - --diffusion-attention-backend
      - CUDNN_ATTN

    ports:
      - "8000:8000"

    deploy:
      resources:
        reservations:
          memory: ${H3_VLLM_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              # count: 2
              # 必须写字符串：本机 Compose 5.6.0 对整数直接校验失败（exit=1），
              # 旧版 compose 会自动转换；统一写字符串避免版本差异
              device_ids: ["0", "1"]
              capabilities:
                - gpu

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"
        ]
      interval: 300s
      timeout: 10s
      retries: 2
      start_period: 600s

  # ══ 实例 1：GPU 2,3 → :8001 ══════════════════════════════════════════════
  minimax-h3-1:
    <<: *vllm-common
    container_name: minimax-h3-vllm-a100-1

    # 参数与 minimax-h3-0 完全一致，仅 GPU 对 / 端口 / 容器名不同。
    # YAML 序列不能跨服务继承，改动任一实例的参数时 4 个实例必须同步改。
    command:
      - vllm
      - serve
      - /models/MiniMax-H3
      - --omni
      - --task-type
      - ref2va
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --trust-remote-code
      - --num-gpus
      - "2"
      - --tensor-parallel-size
      - "2"
      - --usp
      - "1"
      - --ring
      - "1"
      - --text-encoder-tp-size
      - "2"
      - --vae-patch-parallel-size
      - "2"
      - --vae-parallel-mode
      - tile
      - --vae-use-tiling
      - --enable-distributed-layerwise-offload
      - --dlo-no-use-allgather
      - --dlo-resident-layers
      - "24"
      - --enforce-eager
      - --diffusion-attention-backend
      - CUDNN_ATTN

    ports:
      - "8001:8001"

    deploy:
      resources:
        reservations:
          memory: ${H3_VLLM_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              device_ids: ["2", "3"]
              capabilities:
                - gpu

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health').status == 200 else 1)"
        ]
      interval: 300s
      timeout: 10s
      retries: 2
      start_period: 600s

  # ══ 实例 2：GPU 4,5 → :8002 ══════════════════════════════════════════════
  minimax-h3-2:
    <<: *vllm-common
    container_name: minimax-h3-vllm-a100-2

    # 参数与 minimax-h3-0 完全一致，仅 GPU 对 / 端口 / 容器名不同
