# MiniMax-H3 (SGLang Diffusion) 服务编排 —— 2× NVIDIA A100 40GB × 4 实例（每实例 TP2）
#
# ── 多实例（一进程一实例，一次起 4 个）──────────────────────────────────────
#   minimax-h3-0  GPU 0,1  →  http://<host>:30010   （脚本默认端口，向后兼容）
#   minimax-h3-1  GPU 2,3  →  http://<host>:30011
#   minimax-h3-2  GPU 4,5  →  http://<host>:30012
#   minimax-h3-3  GPU 6,7  →  http://<host>:30013
#   每实例仍是 TP2 + layerwise-offload，单卡显存口径与单实例方案完全一致；
#   变的只是宿主机侧资源：RAM / SWAP 上限是「每实例」一份，4 份相加才是总需求。
#     - 默认 mem_limit=384g/实例 → 4 实例合计 1536g，宿主机 RAM 需 ≥ 1.5 TiB；
#     - RAM 不足时用 H3_SGL_MEM_LIMIT / H3_SGL_MEMSWAP_LIMIT / H3_SGL_MEM_RESERVATION
#       统一调小；但层卸载把 ~130 GiB 权重放在主机内存，单实例 < ~160g 基本必然 OOM，
#       384 GiB 级机器只能起 1 个实例，不能按 1/4 硬切。
#     - ipc: host 时 /dev/shm 就是宿主机的 /dev/shm（shm_size 不生效，保留仅为兼容），
#       4 实例共享同一份，容量由宿主机决定。
#   单独起/重启某个实例：docker compose up -d minimax-h3-1 / docker compose restart minimax-h3-2
#   请求打到不同实例：PORT=30011 bash scripts/ref2va-request-sglang.sh
#
# ⚠️ 2×A100 40GB 的显存墙（来自仓库权重实测，非估算）：
#   - transformer 权重 ~61.7 GiB(bf16)，TP2 仅对半切 → 每卡 ~30.9 GiB
#   - text_encoder(Qwen3VL) 权重 ~62.1 GiB(bf16)，TP2 → 每卡 ~31.1 GiB
#   - vae ~9.7 GiB（其中 video VAE encoder / audio VAE 强制常驻，不卸载）
#   - Ulysses 只切「序列/激活」、不切「权重」！故 TP2+Ulysses1 每卡权重仍是约 1/2(~31G)，
#     30.9(只卸载 dit 部分常驻)+31.1+9.7+激活/上下文 >> A100 40G，必须开 layerwise-offload 把
#     dit/text_encoder(vae decoder) 权重层卸载到主机内存(lossless)，每卡只留少量常驻层，稳过 40G。
#   （层卸载不可与 --encoder-parallel / FSDP 混用）
#   官方 RTX 5090 32GB 实测：同 recipe 每卡采样峰值 26.3 GiB（1344×768, 50步）。
#   A100 40GB 比 5090 多 8GB，理论上可上探更高 resident 层；当前统一取 24（多实例并行优先留余量）。
#
# 参数映射（来自官方 RTX 5090 配方，2026-08-11 复核）：
#   官方已验证 2×RTX 5090 32GB recipe（377 GiB host，建议 384 GiB-class）：
#     --tp-size 2 --ulysses-degree 1 --performance-mode memory
#     --layerwise-offload-components dit,text_encoder,vae
#     --dit-offload-prefetch-size 1 --dit-layerwise-resident-layers 20
#     --enable-torch-compile false
#   以下参数官方已明确验证，无需再质疑，本方案核心方向成立：
#     weights=ref2va -> --model-variant ref2va（默认只加载 Ref2VA 分支权重，服务 ref2va 请求；
#                       t2va/fl2va 需改回 --model-variant fl2va）
#     quant=bf16     -> 默认精度，不添加 --quantization
#     TP2 + Ulysses1 -> 仅 2 卡时最合理的并行划分
#     performance-mode memory + layerwise-offload -> 40G 装不下 TP2 半量权重，必须层卸载
#   仅 --dit-layerwise-resident-layers 为 A100 适配值（当前 24，官方 5090 用 20），需实测（见下）。
#
# ⚠️ 关于 layerwise-offload-components=vae 的重要澄清（官方说明）：
#   不要把 "vae" 理解为「整个 VAE 全部卸载」。官方明确：
#     - Video VAE Decoder blocks：one-layer prefetch + ZERO resident layers（卸载）
#     - Video VAE Encoder：STAYS RESIDENT（其 down blocks 无法承载 layerwise hooks，必须常驻）
#     - Audio VAE（约 577 MiB）：STAYS RESIDENT（卸载只增传输开销）
#     - Text Encoder：one-layer prefetch + ZERO resident（卸载）
#   即「vae」只控制 decoder 的卸载策略，encoder/audio VAE 由 sglang 内部强制常驻。
#
# ⚠️ 模型来源与离线解析（已实测确认，2026-08-11）：
#   当前方案 = --model-path MiniMaxAI/MiniMax-H3（HF 根 ID）+ SGLANG_USE_MODELSCOPE=true
#             + MODELSCOPE_CACHE=/root/.cache/modelscope
#   ModelScope 1.39.0 经 legacy cache 离线复用，容器内日志打印：
#     "Found legacy cache at /root/.cache/modelscope/models/MiniMaxAI/MiniMax-H3, reusing."
#   官方文档推荐 ModelScope 根模型 ID 为 MiniMax/MiniMax-H3（非 MiniMaxAI/ 前缀）；
#   若改用官方 ModelScope ID，需把 --model-path 换为 MiniMax/MiniMax-H3 并同步挂载路径。
#   本文件保持已验证的 legacy cache 复用方案（挂载 MiniMaxAI/MiniMax-H3）。
#   【已废弃、不再使用】HF fake cache / scripts/register-modelscope-cache.sh /
#   fake revision(0000...0000) / --model-path /models/MiniMax-H3 /
#   --pipeline-class-name MiniMaxH3Pipeline
#
# 挂载策略（实测可用）：
#   - 模型本体 bind 到 /root/.cache/modelscope/models/MiniMaxAI/MiniMax-H3
#     （与 MODELSCOPE_CACHE 同根，sglang 直接复用该 legacy cache，无需 register 脚本）
#   - modelscope_cache 元数据目录需 rw（写 lock/refs）；模型文件本身只读访问，
#     若实测稳定可尝试将模型本体挂载改 :ro，本文件保留 rw 以兼容首次解析写元数据。
#   - /models/MiniMax-H3:ro 为兜底挂载（当前 --model-path 走仓库 ID 实际不依赖它）。
#
# 前置条件：
#   - 已构建镜像 minimax-h3-sglang:v0.5.22（与同目录 Dockerfile 的 FROM 对齐，
#     需含 sglang diffusion 后端）。旧的 :latest 是 nightly-dev-20260803 构建，不要再用。
#   - 模型已在宿主机 /model_nas/models/MiniMax-H3，且离线 legacy cache 已存在于
#     /model_nas/modelscope_cache（ModelScope 1.39.0 已能离线复用，无需 register 脚本）。
#   - 已安装 nvidia-container-toolkit，docker compose >= 2.0
#   - 宿主机内存：单实例建议 384 GiB-class（官方 2×RTX 5090 配方即 377 GiB host）；
#     4 实例并行 → 建议 ≥ 1.5 TiB（4 × 384 GiB），最低也别低于 4 × 160 GiB。
#     bf16 模型总量约 134 GiB 需足以承载卸载层；不足会 swap，极慢甚至 OOM-kill。
#     mem_limit=384g / memswap_limit=386g 把 SWAP 硬上限锁在 2G（每实例），
#     故宿主机 RAM 必须 ≥ 4 × 384G 才不触 swap。
#
# 启动（实测可用的起法）：
#   1) docker compose up -d                          # 一次拉起 4 个实例
#   2) 日志：docker compose logs -f minimax-h3-0     # 其余实例换容器名 minimax-h3-sglang-1..3
#   3) 停止：docker compose down
#   4) 只重启某个实例：docker compose restart minimax-h3-2
# 验证 SGLang 是否含 MiniMax-H3 native backend（必要时，任一实例即可）：
#   docker compose exec -T minimax-h3-0 python - <<'PY'
#   import os, sglang
#   root = os.path.dirname(sglang.__file__)
#   hits = [os.path.join(d, f) for d, _, fs in os.walk(root) for f in fs if "minimax" in f.lower()]
#   print("MINIMAX FILES:", hits or "NONE -> 镜像不含 native MiniMax-H3 backend")
#   PY
# 验证 SWAP 硬限制是否真正生效（cgroup v2，以实例 0 为例）：
#   CID=$(docker inspect -f '{{.Id}}' minimax-h3-sglang-0)
#   docker exec -T minimax-h3-sglang-0 cat /sys/fs/cgroup/memory.max          # 应 = 384G (412316860416)
#   docker exec -T minimax-h3-sglang-0 cat /sys/fs/cgroup/memory.swap.max      # 应 = 2G  (2147483648)
#   docker exec -T minimax-h3-sglang-0 cat /sys/fs/cgroup/memory.swap.current  # 实测 SWAP 占用，应 < 2G
#   docker stats --no-stream minimax-h3-sglang-0                               # 宿主侧佐证

# ───────────────────────────────────────────────────────────────────────────
# 公共片段（4 个实例共享定义；YAML 锚点，避免重复 4 份）
# 注意：下面所有「内存 / SWAP / 挂载 / 环境变量」都是「每实例」口径。
# ───────────────────────────────────────────────────────────────────────────
x-h3-common: &h3-common
  image: minimax-h3-sglang:v0.5.22
  ipc: host
  pid: host
  shm_size: 512gb            # ipc: host 时 /dev/shm 即宿主机 shm，本项不生效，保留仅为兼容
  restart: unless-stopped

  # ── 内存 / SWAP 硬限制（每实例，service 级，Docker Compose 原生支持）─────────
  # 单实例目标：SWAP 硬上限严格 < 2.5G。
  #   mem_limit     = RAM 上限 384G
  #   memswap_limit = RAM+SWAP 总上限 386G → SWAP 硬上限 = 386-384 = 2G < 2.5G
  #   mem_swappiness = 0 → 尽量不落盘，仅在 OOM 临界才 swap
  # 语义：SWAP 为硬性上限（非倾向），由 memswap_limit-mem_limit 直接约束。
  # 多实例：4 份上限相加 ≈ 1.5 TiB，宿主机 RAM 必须跟上（见文件头）。
  mem_limit: ${H3_SGL_MEM_LIMIT:-384g}
  memswap_limit: ${H3_SGL_MEMSWAP_LIMIT:-386g}
  mem_swappiness: 0
  mem_reservation: ${H3_SGL_MEM_RESERVATION:-256g}   # soft reservation（保底不被挤占），非 SWAP 限制

  volumes:
    # 兜底挂载：模型本体只读挂到 /models/MiniMax-H3（当前 --model-path 走仓库 ID 不依赖它）
    - /model_nas/models/MiniMax-H3:/models/MiniMax-H3:ro
    # ModelScope 离线 cache 元数据目录：必须 rw（sglang/ModelScope 写 lock / refs）
    - /model_nas/modelscope_cache:/root/.cache/modelscope:rw
    # 模型本体直接 bind 为 legacy cache 目标，sglang 经 SGLANG_USE_MODELSCOPE=true
    # 复用该目录（实测日志："Found legacy cache at .../MiniMax-H3, reusing."）
    # 模型文件本身只读访问；保留 rw 以兼容首次解析写元数据，后续可试 :ro
    - /model_nas/models/MiniMax-H3:/root/.cache/modelscope/models/MiniMaxAI/MiniMax-H3:rw
    - /data/minimax-h3:/data/minimax-h3:ro

  environment:
    - SGLANG_USE_MODELSCOPE=true
    - MODELSCOPE_CACHE=/root/.cache/modelscope
    - HF_HUB_OFFLINE=1            # 双保险：禁止 sglang 走 HF 网络回退
    - SGLANG_HEALTH_CHECK_TIMEOUT=120   # 放宽服务端 /health 自检超时（默认 20s），
                                        # 避免层卸载忙时 /health 被误判不健康。

services:
  # ══ 实例 0：GPU 0,1 → :30010（脚本默认端口，向后兼容）═════════════════════
  minimax-h3-0:
    <<: *h3-common
    container_name: minimax-h3-sglang-0

    command:
      - sglang
      - serve
      - --model-path
      - MiniMaxAI/MiniMax-H3       # HF 根 ID：触发 sglang 原生 MiniMax-H3 backend；
                                   # 文件经 ModelScope resolver 从下方缓存路径解析（legacy cache 复用）
      - --model-variant
      - ref2va                      # weights=ref2va：加载 Ref2VA 分支权重，默认服务 ref2va 请求
      - --num-gpus
      - "2"
      - --tp-size
      - "2"                         # 官方 recipe：TP2
      - --ulysses-degree
      - "1"                         # 官方 recipe：Ulysses1
      - --performance-mode
      - memory                     # 官方 recipe：memory（省显存放置）
      - --layerwise-offload-components
      - dit,text_encoder,vae       # 官方 recipe（lossless 层卸载到主机内存）。
                                   # 注：vae 仅控制 decoder 卸载；encoder/audio VAE 由 sglang 强制常驻。
      - --dit-offload-prefetch-size
      - "1"                         # 官方 recipe：prefetch 1
      - --enable-torch-compile
      - "false"                     # 官方 recipe：关闭 torch.compile（5090 配方明确验证）
      - --dit-layerwise-resident-layers
      - "24"                       # 统一取 24（保守值，4 实例同机优先留显存余量）。
                                   # 官方 5090 验证值是 20；A100 40GB 理论上可上探，
                                   # 但多实例并行时先保证每卡峰值 < 38G，确认整机稳定后再逐档上探 32/40。
      # 超时：--watchdog-timeout 是 srt 参数（diffusion 路径不读它，no-op），这里不保留；
      # 它在 v0.5.21/v0.5.22 都仍被接受（srt/arg_groups/fields/device.py），加不加都不影响扩散。
      # 扩散侧真正的 RPC 超时是 --scheduler-rpc-timeout（v0.5.21 起）。
      # 默认 None = 不设 transport 层超时，异常时会无限挂住；这里保留旧 handoff 的
      # 3h 意图，超时后 job 被标 failed 而不是永远等下去。
      - --scheduler-rpc-timeout
      - "10800"
      - --host
      - 0.0.0.0
      - --port
      - "30010"

    ports:
      - "30010:30010"

    deploy:
      resources:
        reservations:
          memory: ${H3_SGL_MEM_RESERVATION:-256g}   # soft reservation（与 service 级 mem_reservation 同源），仅保底不被挤占，非 SWAP 限制
          devices:
            - driver: nvidia
              # count: 2
              # 必须写字符串：本机 Compose 5.6.0 对整数直接校验失败（exit=1），
              # 旧版 compose 会自动转换；统一写字符串避免版本差异
              device_ids: ["0", "1"]
              capabilities: [gpu]
        # 注：SWAP 硬限制由 service 级 mem_limit/memswap_limit 实现（见上方），
        # 此处不再设 limits.memory，避免与 service 级 mem_limit 语义冲突。

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:30010/health').status==200 else 1)"]
      interval: 300s
      timeout: 30s
      retries: 2
      start_period: 600s

  # ══ 实例 1：GPU 2,3 → :30011 ═══════════════════════════════════════════════
  minimax-h3-1:
    <<: *h3-common
    container_name: minimax-h3-sglang-1

    # 参数与 minimax-h3-0 完全一致（A100 40G 配方），仅 GPU 对 / 端口 / 容器名不同。
    # YAML 序列不能跨服务继承，改动任一实例的参数时 4 个实例必须同步改。
    command:
      - sglang
      - serve
      - --model-path
      - MiniMaxAI/MiniMax-H3
      - --model-variant
      - ref2va
      - --num-gpus
      - "2"
      - --tp-size
      - "2"
      - --ulysses-degree
      - "1"
      - --performance-mode
      - memory
      - --layerwise-offload-components
      - dit,text_encoder,vae
      - --dit-offload-prefetch-size
      - "1"
      - --enable-torch-compile
      - "false"
      - --dit-layerwise-resident-layers
      - "24"
      - --scheduler-rpc-timeout
      - "10800"
      - --host
      - 0.0.0.0
      - --port
      - "30011"

    ports:
      - "30011:30011"

    deploy:
      resources:
        reservations:
          memory: ${H3_SGL_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              device_ids: ["2", "3"]
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:30011/health').status==200 else 1)"]
      interval: 300s
      timeout: 30s
      retries: 2
      start_period: 600s

  # ══ 实例 2：GPU 4,5 → :30012 ═══════════════════════════════════════════════
  minimax-h3-2:
    <<: *h3-common
    container_name: minimax-h3-sglang-2

    # 参数与 minimax-h3-0 完全一致，仅 GPU 对 / 端口 / 容器名不同
    command:
      - sglang
      - serve
      - --model-path
      - MiniMaxAI/MiniMax-H3
      - --model-variant
      - ref2va
      - --num-gpus
      - "2"
      - --tp-size
      - "2"
      - --ulysses-degree
      - "1"
      - --performance-mode
      - memory
      - --layerwise-offload-components
      - dit,text_encoder,vae
      - --dit-offload-prefetch-size
      - "1"
      - --enable-torch-compile
      - "false"
      - --dit-layerwise-resident-layers
      - "24"
      - --scheduler-rpc-timeout
      - "10800"
      - --host
      - 0.0.0.0
      - --port
      - "30012"

    ports:
      - "30012:30012"

    deploy:
      resources:
        reservations:
          memory: ${H3_SGL_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              device_ids: ["4", "5"]
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:30012/health').status==200 else 1)"]
      interval: 300s
      timeout: 30s
      retries: 2
      start_period: 600s

  # ══ 实例 3：GPU 6,7 → :30013 ═══════════════════════════════════════════════
  minimax-h3-3:
    <<: *h3-common
    container_name: minimax-h3-sglang-3

    # 参数与 minimax-h3-0 完全一致，仅 GPU 对 / 端口 / 容器名不同
    command:
      - sglang
      - serve
      - --model-path
      - MiniMaxAI/MiniMax-H3
      - --model-variant
      - ref2va
      - --num-gpus
      - "2"
      - --tp-size
      - "2"
      - --ulysses-degree
      - "1"
      - --performance-mode
      - memory
      - --layerwise-offload-components
      - dit,text_encoder,vae
      - --dit-offload-prefetch-size
      - "1"
      - --enable-torch-compile
      - "false"
      - --dit-layerwise-resident-layers
      - "24"
      - --scheduler-rpc-timeout
      - "10800"
      - --host
      - 0.0.0.0
      - --port
      - "30013"

    ports:
      - "30013:30013"

    deploy:
      resources:
        reservations:
          memory: ${H3_SGL_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              device_ids: ["6", "7"]
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:30013/health').status==200 else 1)"]
      interval: 300s
      timeout: 30s
      retries: 2
      start_period: 600s
