# MiniMax-H3 (SGLang Diffusion) 服务编排
#
# 硬件：2× NVIDIA A100 40GB（受限于 40G 显存，参考 RTX 5090 32G 的层卸载方案）
#
# 参数映射（来自官方 5090 配方 + 适配 A100 40G）：
#   weights=fl2va  -> --model-variant fl2va（同时可服务 t2va / fl2va 请求）
#   quant=bf16     -> 默认精度，不添加 --quantization
#   TP2 + Ulysses1 -> 仅 2 卡时最合理的并行划分
#   performance-mode memory + layerwise-offload -> 40G 装不下 TP2 半量权重(~41G)，必须层卸载
#
# 为什么必须层卸载：TP2 下每卡约 41G 权重，超过 A100 40G 显存，
# 故沿用 5090 32G 验证过的 dit/text_encoder/vae 层卸载方案（lossless）。
# 注意：层卸载不可与 FSDP 推理 / Cache-Dit / --encoder-parallel 混用，故本文件不加 encoder-parallel。
#
# 前置条件：
#   - 已构建镜像 minimax-h3-sglang:latest（见同目录 Dockerfile）
#   - 模型已下载到宿主机的 /model_nas/models/MiniMax-H3（完整仓库根，含 fl2va/ref2va 变体目录）
#   - 宿主机有足够内存承载 layerwise offload（5090 官方建议 384 GiB 级，A100 同理）
#   - 已安装 nvidia-container-toolkit，docker compose >= 2.0
#
# 启动：  docker compose -f docker-compose.2xa100.yml up -d
# 日志：  docker compose -f docker-compose.2xa100.yml logs -f minimax-h3
# 停止：  docker compose -f docker-compose.2xa100.yml down

services:
  minimax-h3:
    image: minimax-h3-sglang:latest
    container_name: minimax-h3-sglang
    ipc: host
    pid: host
    shm_size: 512gb
    restart: unless-stopped

    command:
      - sglang
      - serve
      - --model-path
      - /models/MiniMax-H3          # 容器内挂载点，对应宿主机 /model_nas/models/MiniMax-H3
      - --pipeline-class-name
      - MiniMaxH3Pipeline           # 必须显式指定：model_index.json 的 _class_name 是
                                    # diffusers 侧的 MiniMaxH3ModularPipeline，与 sglang
                                    # 注册表键 MiniMaxH3Pipeline 不一致；不指定会静默回退
                                    # 到通用 diffusers 后端，而 diffusers 0.37.0 无该类，
                                    # 最终报 HFValidationError
      - --model-variant
      - fl2va                       # weights=fl2va
      - --num-gpus
      - "2"
      - --tp-size
      - "2"
      - --ulysses-degree
      - "1"
      - --performance-mode
      - memory                      # 40G 显存受限，启用省显存放置策略
      - --layerwise-offload-components
      - dit,text_encoder,vae        # 层卸载到主机内存（lossless）
      - --dit-offload-prefetch-size
      - "1"
      - --dit-layerwise-resident-layers
      - "20"                        # A100 比 5090 多 8G，可按 nvidia-smi 余量上调到 24~28
      - --enable-torch-compile
      - "false"                     # H3 的 torch.compile 会改变数值，禁止用于一致性
      - --host
      - 0.0.0.0
      - --port
      - "30010"

    ports:
      - "30010:30010"

    volumes:
      - /model_nas/models/MiniMax-H3:/models/MiniMax-H3:ro
      - /data/minimax-h3:/data/minimax-h3:ro

    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_HOME=/root/.cache/huggingface

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:30010/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 900s            # 层卸载加载较慢，放宽首次就绪时间
