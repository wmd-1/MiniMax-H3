# MiniMax-H3 (vLLM-Omni) —— 2× RTX 5090 32GB × 4 实例（每实例 TP2 + DLO 24 层）
#
# ── 多实例（一进程一实例，一次起 4 个）──────────────────────────────────────
#   minimax-h3-0  GPU 0,1  →  http://<host>:8000   （脚本默认端口，向后兼容）
#   minimax-h3-1  GPU 2,3  →  http://<host>:8001
#   minimax-h3-2  GPU 4,5  →  http://<host>:8002
#   minimax-h3-3  GPU 6,7  →  http://<host>:8003
#   容器内一律监听 8000，实例差异只在宿主机发布端口与 GPU 对；
#   单实例显存口径不变（TP2 + DLO 24 resident 层；官方 5090 验证值是 20，这里统一取 24）。
#   宿主机侧 RAM / SWAP 是「每实例」一份：默认 384g / 386g，4 份合计 ≈ 1.5 TiB，
#   可用 H3_VLLM_MEM_LIMIT / H3_VLLM_MEMSWAP_LIMIT / H3_VLLM_MEM_RESERVATION 覆盖。
#   单实例操作：docker compose -f docker-compose.vllm.5090.yml up -d minimax-h3-1
#
# 基于 vLLM 镜像（见同目录 Dockerfile.vllm，FROM vllm/vllm-omni:v0.34.0）。
# serve 参数映射自官方 recipe（recipes.vllm.ai/MiniMaxAI/MiniMax-H3, hardware=rtx_5090_2x）：
#   - 默认加载 Ref2VA DiT（--task-type ref2va），分布式层卸载（DLO）24 resident 层
#   - TP2 + text-encoder-tp 2 + vae tile 并行 2，Ulysses SP1 / ring1
#   - CUDNN_ATTN 后端，enforce-eager，无需 FlashAttention-4
#
# 前置条件：
#   - 已构建镜像 video-vllm:v0.34.0（docker build -f Dockerfile.vllm -t video-vllm:v0.34.0 .）
#   - 模型已在宿主机 /model_nas/models/MiniMax-H3（只读 bind 进容器 /models/MiniMax-H3）
#   - 已安装 nvidia-container-toolkit，docker compose >= 2.0，且宿主机至少有 8 张卡
#   - 宿主机内存：单实例建议 384 GiB-class（官方 2×RTX 5090 配方 377 GiB host）；
#     4 实例并行 → 建议 ≥ 1.5 TiB（4 × 384 GiB）。
#     bf16 模型总量约 134 GiB 需足以承载卸载层；不足会 swap，极慢甚至 OOM-kill。
#     mem_limit=384g / memswap_limit=386g 已把 SWAP 硬上限锁在 2G（每实例）。
#
# 启动：
#   1) docker compose -f docker-compose.vllm.5090.yml up -d          # 一次拉起 4 个实例
#   2) 日志：docker compose -f docker-compose.vllm.5090.yml logs -f minimax-h3-0
#   3) 停止：docker compose -f docker-compose.vllm.5090.yml down
# 验证 SWAP 硬限制（cgroup v2，以实例 0 为例）：
#   docker exec -T minimax-h3-vllm-0 cat /sys/fs/cgroup/memory.max        # 应 = 384G
#   docker exec -T minimax-h3-vllm-0 cat /sys/fs/cgroup/memory.swap.max   # 应 = 2G

# ───────────────────────────────────────────────────────────────────────────
# 公共片段（4 个实例共享定义）：镜像、内存、命令、挂载、环境变量、健康检查
# 容器内端口固定 8000 —— 4 个实例的 command / healthcheck 完全一致，
# 只有宿主端口与 GPU 对写在各自的 service 上。
# ───────────────────────────────────────────────────────────────────────────
x-vllm-common: &vllm-common
  # tag 与 Dockerfile.vllm 的 FROM 对齐；旧 :latest 是 2026-08 的旧构建
  image: video-vllm:v0.34.0
  ipc: host
  pid: host
  shm_size: 512gb           # ipc: host 时 /dev/shm 即宿主机 shm，本项不生效，保留仅为兼容
  restart: unless-stopped

  # ── 内存 / SWAP 硬限制（每实例）────────────────────────────────────────
  mem_limit: ${H3_VLLM_MEM_LIMIT:-384g}
  memswap_limit: ${H3_VLLM_MEMSWAP_LIMIT:-386g}
  mem_swappiness: 0
  mem_reservation: ${H3_VLLM_MEM_RESERVATION:-256g}

  command:
    - vllm
    - serve
    - /models/MiniMax-H3
    - --omni
    - --task-type
    - ref2va                     # 默认 ref2va（需 Ref2VA 权重）；官方 5090 recipe 是 FL2VA，DLO 20 层沿用其值，需实测
    - --host
    - 0.0.0.0
    - --port
    - "8000"                     # 容器内固定端口；宿主端口见各 service 的 ports
    - --trust-remote-code
    - --num-gpus
    - "2"
    - --tensor-parallel-size
    - "2"                        # TP2
    - --usp
    - "1"                        # Ulysses SP1
    - --ring
    - "1"
    - --text-encoder-tp-size
    - "2"
    - --vae-patch-parallel-size
    - "2"
    - --vae-parallel-mode
    - tile
    - --vae-use-tiling
    - --enable-distributed-layerwise-offload
    - --dlo-no-use-allgather
    - --dlo-resident-layers
    - "24"                       # 统一取 24（官方 5090 验证值 20；多实例并行留余量）
    - --enforce-eager
    - --diffusion-attention-backend
    - CUDNN_ATTN

  volumes:
    # 模型本体只读挂到 /models/MiniMax-H3（Dockerfile 默认 serve 路径）
    - /model_nas/models/MiniMax-H3:/models/MiniMax-H3:ro
    - /data/minimax-h3:/data/minimax-h3:ro

  environment:
    # 不再显式写 CUDA_VISIBLE_DEVICES：由下方 device_ids 决定可见卡，
    # 容器内统一重编号为 0,1
    - VLLM_WORKER_MULTIPROC_METHOD=spawn
    - VLLM_OMNI_VIDEO_SYNC_TIMEOUT=14400
    - DLO_RESIDENT_LAYERS=24
    - WIDTH=1344
    - HEIGHT=768
    - HF_HUB_OFFLINE=1           # 离线：禁止 vllm 走 HF 网络回退

  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
    interval: 30s
    timeout: 10s
    retries: 2
    start_period: 600s

services:
  # ══ 实例 0：GPU 0,1 → 宿主 :8000 ═══════════════════════════════════════════
  minimax-h3-0:
    <<: *vllm-common
    container_name: minimax-h3-vllm-0

    ports:
      - "8000:8000"

    deploy:
      resources:
        reservations:
          memory: ${H3_VLLM_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              device_ids: ["0", "1"]
              capabilities: [gpu]

  # ══ 实例 1：GPU 2,3 → 宿主 :8001 ═══════════════════════════════════════════
  minimax-h3-1:
    <<: *vllm-common
    container_name: minimax-h3-vllm-1

    ports:
      - "8001:8000"

    deploy:
      resources:
        reservations:
          memory: ${H3_VLLM_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              device_ids: ["2", "3"]
              capabilities: [gpu]

  # ══ 实例 2：GPU 4,5 → 宿主 :8002 ═══════════════════════════════════════════
  minimax-h3-2:
    <<: *vllm-common
    container_name: minimax-h3-vllm-2

    ports:
      - "8002:8000"

    deploy:
      resources:
        reservations:
          memory: ${H3_VLLM_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              device_ids: ["4", "5"]
              capabilities: [gpu]

  # ══ 实例 3：GPU 6,7 → 宿主 :8003 ═══════════════════════════════════════════
  minimax-h3-3:
    <<: *vllm-common
    container_name: minimax-h3-vllm-3

    ports:
      - "8003:8000"

    deploy:
      resources:
        reservations:
          memory: ${H3_VLLM_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              device_ids: ["6", "7"]
              capabilities: [gpu]
