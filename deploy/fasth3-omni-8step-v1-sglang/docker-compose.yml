# FastVideo/FastVideo-FastH3-Omni-8-Step-V1 — SGLang v0.5.23 —— 4 实例（每实例 TP2）
#
# ── 多实例（一进程一实例，一次起 4 个）──────────────────────────────────────
#   minimax-h3-0  GPU 0,1  →  http://<host>:30060
#   minimax-h3-1  GPU 2,3  →  http://<host>:30061
#   minimax-h3-2  GPU 4,5  →  http://<host>:30062
#   minimax-h3-3  GPU 6,7  →  http://<host>:30063
#   容器内固定 30010；宿主端口段 30060-30063 专用（见 MODELS-PATHS.md 端口表）。
#   RAM/SWAP 每实例一份，默认 384g/386g；8×A100/768GiB 用 H3_SGL_MEM_* 下调。
#   ⚠️ 4 实例共用 HF cache 与 overlay cache；首启先单起实例 0 预热再拉其余。
#
# 这是 FastH3-Omni 的 **SGLang 路线**（另有 vLLM 路线见 fasth3-omni-8step-v1-vllm）。
# 选 SGLang 的依据：Omni 支持在 SGLang PR #45530（2026-10-22）落地，进了 v0.5.23；
# A100(SM80) 拿不到 VSA-H3 内核（tcgen05 SM100/103、Triton tile-64 SM90），SGLang
# 允许显式稠密回退 --component-attention-backends transformer=fa（4×H200 上 dense FA
# 比 VSA 慢约 25%）。这条是报告推荐的 A100 路径。
#
# 能力边界：**仅 ref2va**（9 图/3 视频/3 音频，至少一个视觉参考）。
# 契约（FastH3OmniPipelineConfig / SamplingParams）：
#   - 拒绝 --model-variant（自带唯一 ref2va 分区）；
#   - 固定 8 步 PDD（overlay 自动把 32 区间头融合成 8 逐步头，无需手工 fuse）；
#   - 默认 flow_shift 12 / audio_flow_shift 3、clean references（cond-noise-aug 1.0）；
#   - quality 默认 lossless；不支持 quality:"high"；VSA-H3 与 ring>1/torch.compile/BCG 互斥。
#
# 权重（HF；overlay 自动融合头 + 链接 pinned Ref2VA 的 TE/VAE，base 为 gated）：
#   HF_HOME=/model_nas/hf-cache HF_TOKEN=... hf download FastVideo/FastVideo-FastH3-Omni-8-Step-V1
#   HF_HOME=/model_nas/hf-cache HF_TOKEN=... hf download MiniMaxAI/MiniMax-H3
#
# 请求（异步 /v1/videos）：task=ref2va, num_inference_steps=8, 默认 shift 12/3,
#   至少一个视觉参考；quality 默认 lossless。

x-omni-common: &omni-common
  image: minimax-h3-sglang:v0.5.23
  build:
    context: ../images
    dockerfile: Dockerfile.sglang-v0.5.23

  ipc: host
  pid: host
  shm_size: 512gb

  restart: unless-stopped

  mem_limit: ${H3_SGL_MEM_LIMIT:-384g}
  memswap_limit: ${H3_SGL_MEMSWAP_LIMIT:-386g}
  mem_swappiness: 0
  mem_reservation: ${H3_SGL_MEM_RESERVATION:-256g}

  command:
    - sglang
    - serve
    - --model-path
    - FastVideo/FastVideo-FastH3-Omni-8-Step-V1
    # 不传 --model-variant：Omni 自带唯一 ref2va 分区，传了会被拒
    - --num-gpus
    - "2"
    - --tp-size
    - "2"
    - --ulysses-degree
    - "1"
    # SM80 无 VSA-H3 内核；显式稠密 FA（跳过 compression gate，约慢 25%）
    - --component-attention-backends
    - transformer=fa
    - --performance-mode
    - memory
    - --layerwise-offload-components
    - dit,text_encoder,vae
    - --dit-offload-prefetch-size
    - "1"
    - --dit-layerwise-resident-layers
    - "24"
    # Omni 与 FastH3 一样拒绝 torch.compile / BCG / ring>1
    - --enable-torch-compile
    - "false"
    - --warmup-resolutions
    - 1344x768
    - --warmup-num-frames
    - "124"
    # RPC 超时：不传 --scheduler-rpc-timeout，走默认 None（不设 transport 层超时）
    - --host
    - 0.0.0.0
    - --port
    - "30010"

  volumes:
    - /model_nas/hf-cache:/hf-cache:rw
    - /data/minimax-h3:/data/minimax-h3:ro

  environment:
    - HF_HOME=/hf-cache
    - HF_TOKEN=${HF_TOKEN:-}
    - SGLANG_DIFFUSION_CACHE_ROOT=/hf-cache/sglang-omni
    - SGLANG_HEALTH_CHECK_TIMEOUT=120

  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:30010/health').status==200 else 1)"]
    interval: 300s
    timeout: 30s
    retries: 2
    # 首启拉 gated 权重 + overlay 融合 32→8 头 + 链接 base；给足 30min
    start_period: 1800s

services:
  minimax-h3-0:
    <<: *omni-common
    container_name: minimax-h3-fh3omni-sgl-0
    ports:
      - "30060:30010"
    deploy:
      resources:
        reservations:
          memory: ${H3_SGL_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              device_ids: ["0", "1"]
              capabilities: [gpu]

  minimax-h3-1:
    <<: *omni-common
    container_name: minimax-h3-fh3omni-sgl-1
    ports:
      - "30061:30010"
    deploy:
      resources:
        reservations:
          memory: ${H3_SGL_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              device_ids: ["2", "3"]
              capabilities: [gpu]

  minimax-h3-2:
    <<: *omni-common
    container_name: minimax-h3-fh3omni-sgl-2
    ports:
      - "30062:30010"
    deploy:
      resources:
        reservations:
          memory: ${H3_SGL_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              device_ids: ["4", "5"]
              capabilities: [gpu]

  minimax-h3-3:
    <<: *omni-common
    container_name: minimax-h3-fh3omni-sgl-3
    ports:
      - "30063:30010"
    deploy:
      resources:
        reservations:
          memory: ${H3_SGL_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              device_ids: ["6", "7"]
              capabilities: [gpu]
