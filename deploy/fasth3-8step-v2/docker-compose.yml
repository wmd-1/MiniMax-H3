# FastVideo-FastH3-8-Step-V2 — SGLang v0.5.22 —— 4 实例（每实例 TP2）
#
# ── 多实例（一进程一实例，一次起 4 个）──────────────────────────────────────
#   minimax-h3-0  GPU 0,1  →  http://<host>:30030
#   minimax-h3-1  GPU 2,3  →  http://<host>:30031
#   minimax-h3-2  GPU 4,5  →  http://<host>:30032
#   minimax-h3-3  GPU 6,7  →  http://<host>:30033
#   容器内一律监听 30010，实例差异只在宿主机发布端口与 GPU 对；
#   单实例显存口径不变（TP2 + layerwise offload，resident=24 保守值）。
#   宿主端口段 30030-30033 是给本变体专用的，避免和 base 的 30010-30013、
#   PDD 的 30020-30023、VDN 的 30040-30043 撞车。
#   宿主机侧 RAM / SWAP 是「每实例」一份：默认 384g / 386g，4 份合计 ≈ 1.5 TiB，
#   可用 H3_SGL_MEM_LIMIT / H3_SGL_MEMSWAP_LIMIT / H3_SGL_MEM_RESERVATION 覆盖。
#   单实例操作：docker compose up -d minimax-h3-2 / docker compose restart minimax-h3-2
#
# 选 SGLang 而不是 vLLM 的原因：
#   vLLM-Omni 的 FastH3CheckpointSpec.check_serving_contract() 硬性要求
#   --diffusion-attention-backend FASTVIDEO_VSA；该 VSA 内核面向 SM90+/SM100，
#   A100(SM80) 不可用，且没有稠密回退。SGLang v0.5.22 明确支持用任意稠密
#   后端跑这份权重（跳过 compression gate），所以 A100 上走 SGLang。
#
# 能力边界：仅 T2VA；FL2VA / Ref2VA 请求会被拒绝。这是旁路服务，不是 Ref2VA 主线。
# ⚠️ 因此本文件不能把默认 type 改为 ref2va：权重里没有 Ref2VA 分支。
#
# 首次启动（HF 权重为 gated，需要可访问 MiniMaxAI/MiniMax-H3 的 token）：
#   HF_HOME=/model_nas/hf-cache HF_TOKEN=... \
#     hf download FastVideo/FastVideo-FastH3-8-Step-V2
#   # 视频/音频 VAE 会按 provenance.json 里 pin 的 base revision 从
#   # MiniMaxAI/MiniMax-H3 拉取；离线部署请先用同一 HF_HOME 预热。
#   # 4 实例共用同一个 HF cache，首次预热完成后各实例只读复用。
#
# 请求契约（异步 /v1/videos）：
#   task=t2va, num_inference_steps=8, flow_shift=10, audio_flow_shift=3,
#   guidance_scale=1。步数/shift 不符会被服务端拒绝。
#
# A100 40G 适配：TP2 + layerwise offload；resident=24 是保守值。
#   实测 nvidia-smi 峰值 <36G 可上探 32/40；OOM 则回退 16。
#   若该 tag 的 V2 pipeline 拒绝 TP，可改 --ulysses-degree 2 并把
#   resident-layers 降到 16（Ulysses 不切权重）。

# ───────────────────────────────────────────────────────────────────────────
# 公共片段（4 个实例共享定义）：镜像、内存、命令、挂载、环境变量、健康检查
# 容器内端口固定 30010 —— 4 个实例的 command / healthcheck 完全一致，
# 只有宿主端口与 GPU 对写在各自的 service 上。
# ───────────────────────────────────────────────────────────────────────────
x-fasth3-common: &fasth3-common
  image: video-sglang:v0.5.22
  build:
    context: ../images
    dockerfile: Dockerfile.sglang

  ipc: host
  pid: host
  shm_size: 512gb

  restart: unless-stopped

  mem_limit: ${H3_SGL_MEM_LIMIT:-384g}
  memswap_limit: ${H3_SGL_MEMSWAP_LIMIT:-386g}
  mem_swappiness: 0
  mem_reservation: ${H3_SGL_MEM_RESERVATION:-256g}

  command:
    - sglang
    - serve
    - --model-path
    - FastVideo/FastVideo-FastH3-8-Step-V2
    - --num-gpus
    - "2"
    - --tp-size
    - "2"
    - --ulysses-degree
    - "1"
    # SM80 没有 VSA 内核；显式选稠密 FA（不传也会因 capability 不匹配回退到稠密）
    - --component-attention-backends
    - transformer=fa
    - --performance-mode
    - memory
    - --layerwise-offload-components
    - dit,text_encoder,vae
    - --dit-offload-prefetch-size
    - "1"
    - --dit-layerwise-resident-layers
    - "24"
    - --enable-torch-compile
    - "false"
    - --warmup-resolutions
    - 1344x768
    - --warmup-num-frames
    - "124"
    # RPC 超时：刻意不传 --scheduler-rpc-timeout，走其默认 None = 不设 transport 层 RPC 超时，
    # 避免服务端在 3h 处把长任务标 failed；异常挂住由脚本侧超时/人工兜底。
    - --host
    - 0.0.0.0
    - --port
    - "30010"                    # 容器内固定端口；宿主端口见各 service 的 ports

  volumes:
    # HF cache 同时承载 V2 权重、base VAEs 与 overlay 的 10GB VAE 重序列化
    - /model_nas/hf-cache:/hf-cache:rw
    - /data/minimax-h3:/data/minimax-h3:ro

  environment:
    - HF_HOME=/hf-cache
    - HF_TOKEN=${HF_TOKEN:-}
    - SGLANG_DIFFUSION_CACHE_ROOT=/hf-cache/sglang
    - SGLANG_HEALTH_CHECK_TIMEOUT=120

  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:30010/health').status==200 else 1)"]
    interval: 300s
    timeout: 30s
    retries: 2
    # 首启要拉 gated 权重 + 重序列化 ~10GB video VAE，10 分钟不够；
    # healthcheck 不会重启容器，但 up --wait / 编排器会因此误判。
    start_period: 1800s

services:
  # ══ 实例 0：GPU 0,1 → 宿主 :30030 ══════════════════════════════════════════
  minimax-h3-0:
    <<: *fasth3-common
    container_name: minimax-h3-fasth3-v2-0

    ports:
      - "30030:30010"

    deploy:
      resources:
        reservations:
          memory: ${H3_SGL_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              # 必须写字符串：本机 Compose 5.6.0 对整数直接校验失败
              device_ids: ["0", "1"]
              capabilities: [gpu]

  # ══ 实例 1：GPU 2,3 → 宿主 :30031 ══════════════════════════════════════════
  minimax-h3-1:
    <<: *fasth3-common
    container_name: minimax-h3-fasth3-v2-1

    ports:
      - "30031:30010"

    deploy:
      resources:
        reservations:
          memory: ${H3_SGL_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              device_ids: ["2", "3"]
              capabilities: [gpu]

  # ══ 实例 2：GPU 4,5 → 宿主 :30032 ══════════════════════════════════════════
  minimax-h3-2:
    <<: *fasth3-common
    container_name: minimax-h3-fasth3-v2-2

    ports:
      - "30032:30010"

    deploy:
      resources:
        reservations:
          memory: ${H3_SGL_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              device_ids: ["4", "5"]
              capabilities: [gpu]

  # ══ 实例 3：GPU 6,7 → 宿主 :30033 ══════════════════════════════════════════
  minimax-h3-3:
    <<: *fasth3-common
    container_name: minimax-h3-fasth3-v2-3

    ports:
      - "30033:30010"

    deploy:
      resources:
        reservations:
          memory: ${H3_SGL_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              device_ids: ["6", "7"]
              capabilities: [gpu]
