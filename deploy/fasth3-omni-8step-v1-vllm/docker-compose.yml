# FastVideo/FastVideo-FastH3-Omni-8-Step-V1 — vLLM-Omni v0.33.0rc1 —— 4 实例（每实例 2 卡）
#
# ── 多实例（一进程一实例，一次起 4 个）──────────────────────────────────────
#   minimax-h3-0  GPU 0,1  →  http://<host>:8020
#   minimax-h3-1  GPU 2,3  →  http://<host>:8021
#   minimax-h3-2  GPU 4,5  →  http://<host>:8022
#   minimax-h3-3  GPU 6,7  →  http://<host>:8023
#   容器内固定 8000；宿主端口段 8020-8023 专用（base vLLM 8000-03 / LightX2V 8010-13）。
#   RAM/SWAP 每实例一份，默认 384g/400g；8×A100/768GiB 用 H3_VLLM_MEM_* 下调。
#
# 这是 FastH3-Omni 的 **vLLM 路线**（SGLang 路线见 fasth3-omni-8step-v1-sglang，
# 是报告推荐的 A100 路径）。按"vLLM 优先"提供此版，但注意下面的 A100 警告。
#
# 版本：Omni 的 vLLM 支持首个进 v0.33.0rc1（2026-11-04，预发布）；v0.32.x 没有。
# 镜像 minimax-h3-vllm:v0.33.0rc1 已装 fastvideo-kernel==0.3.4（.[vsa] extra）。
#
# ⚠️ A100(SM80) 关键与未验证项：
#   - Omni 契约硬性要求 FASTVIDEO_VSA；provider 必须用 **triton**（门槛 SM80+，
#     triton_block_sparse.py: capability<(8,0) 才拒），cudnn provider 仅 SM90+，A100 不可用。
#   - **BF16**，不加 --quantization fp8：A100 无原生 FP8（rtx4090 yaml 的 fp8 是 SM89）。
#   - 官方只基准过 1 卡 DLO（rtx4090/5090）与 8 卡 USP+HSDP（Blackwell）；这里的
#     **2 卡 USP2 + DLO** 组合契约合法但**未在 A100 实测**。若启动报错/显存尖峰，
#     退化为每 GPU 单卡实例（--num-gpus 1 --usp 1 + DLO，共 8 实例）——那是 rtx4090
#     验证过的形态。triton VSA 在 SM80 的实际相对损失也无官方数字。
#
# 能力边界：仅 ref2va（至少一个视觉参考）；固定 8 步、guidance 1、shift 12/3。
#
# 权重（HF，gated base）：
#   HF_HOME=/model_nas/hf-cache HF_TOKEN=... hf download FastVideo/FastVideo-FastH3-Omni-8-Step-V1
#   HF_HOME=/model_nas/hf-cache HF_TOKEN=... hf download MiniMaxAI/MiniMax-H3
#
# 请求（/v1/videos/sync）：
#   -F 'prompt=...' -F 'input_reference=@ref.png' -F 'size=1344x768' -F 'seconds=5'
#   num_inference_steps/guidance 已由 default-sampling-params 定为 8/1。

x-omni-vllm-common: &omni-vllm-common
  image: minimax-h3-vllm:v0.33.0rc1
  build:
    context: ../images
    dockerfile: Dockerfile.vllm-v0.33.0rc1

  ipc: host
  shm_size: 64gb

  restart: unless-stopped

  mem_limit: ${H3_VLLM_MEM_LIMIT:-384g}
  memswap_limit: ${H3_VLLM_MEMSWAP_LIMIT:-400g}
  mem_swappiness: 10
  mem_reservation: ${H3_VLLM_MEM_RESERVATION:-256g}

  command:
    - vllm
    - serve
    - FastVideo/FastVideo-FastH3-Omni-8-Step-V1
    - --omni
    - --task-type
    - ref2va
    - --host
    - 0.0.0.0
    - --port
    - "8000"
    - --trust-remote-code
    - --served-model-name
    - FastVideo/FastVideo-FastH3-Omni-8-Step-V1

    # 纯 Ulysses（Omni 契约拒绝 ring>1 / allgather）；DiT 不做 TP
    - --num-gpus
    - "2"
    - --usp
    - "2"
    - --ring
    - "1"
    - --text-encoder-tp-size
    - "2"
    - --vae-patch-parallel-size
    - "2"
    - --vae-parallel-mode
    - tile
    - --vae-use-tiling

    # 40G 放不下 → DLO（no-allgather 满足契约）；A100 BF16，不加 --quantization
    - --enable-distributed-layerwise-offload
    - --dlo-no-use-allgather
    - --dlo-resident-layers
    - "24"
    - --enforce-eager

    # A100 用 triton provider（SM80+），不是 cudnn（SM90+）
    - --diffusion-attention-config
    - '{"default":{"backend":"FASTVIDEO_VSA","fastvideo_vsa_provider":"triton"}}'
    - --default-sampling-params
    - '{"0":{"num_inference_steps":8,"guidance_scale":1}}'

  volumes:
    - /model_nas/hf-cache:/hf-cache:rw
    - /data/minimax-h3:/data/minimax-h3:ro

  environment:
    - VLLM_WORKER_MULTIPROC_METHOD=spawn
    - VLLM_OMNI_VIDEO_SYNC_TIMEOUT=14400
    - HF_HOME=/hf-cache
    - HF_TOKEN=${HF_TOKEN:-}

  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
    interval: 300s
    timeout: 10s
    retries: 2
    # 首启拉 gated 权重 + 建 DLO + triton 内核首编译；给足 30min
    start_period: 1800s

services:
  minimax-h3-0:
    <<: *omni-vllm-common
    container_name: minimax-h3-fh3omni-vllm-0
    ports:
      - "8020:8000"
    deploy:
      resources:
        reservations:
          memory: ${H3_VLLM_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              # 必须写字符串：本机 Compose 5.6.x 对整数直接校验失败
              device_ids: ["0", "1"]
              capabilities: [gpu]

  minimax-h3-1:
    <<: *omni-vllm-common
    container_name: minimax-h3-fh3omni-vllm-1
    ports:
      - "8021:8000"
    deploy:
      resources:
        reservations:
          memory: ${H3_VLLM_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              device_ids: ["2", "3"]
              capabilities: [gpu]

  minimax-h3-2:
    <<: *omni-vllm-common
    container_name: minimax-h3-fh3omni-vllm-2
    ports:
      - "8022:8000"
    deploy:
      resources:
        reservations:
          memory: ${H3_VLLM_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              device_ids: ["4", "5"]
              capabilities: [gpu]

  minimax-h3-3:
    <<: *omni-vllm-common
    container_name: minimax-h3-fh3omni-vllm-3
    ports:
      - "8023:8000"
    deploy:
      resources:
        reservations:
          memory: ${H3_VLLM_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              device_ids: ["6", "7"]
              capabilities: [gpu]
