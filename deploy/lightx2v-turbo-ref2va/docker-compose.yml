# lightx2v/Minimax-h3-Turbo — vLLM-Omni v0.32.0rc1 —— 4 实例（每实例 TP2 + DLO）
#
# ── 多实例（一进程一实例，一次起 4 个）──────────────────────────────────────
#   minimax-h3-0  GPU 0,1  →  http://<host>:8010
#   minimax-h3-1  GPU 2,3  →  http://<host>:8011
#   minimax-h3-2  GPU 4,5  →  http://<host>:8012
#   minimax-h3-3  GPU 6,7  →  http://<host>:8013
#   容器内一律监听 8000，实例差异只在宿主机发布端口与 GPU 对；
#   单实例显存口径不变（TP2 + DLO resident=24，带 LoRA 常驻缓冲的保守值）。
#   宿主端口段 8010-8013 是本变体专用：base vLLM 占 8000-8003，不能混用。
#   宿主机侧 RAM / SWAP 是「每实例」一份：默认 384g / 400g，4 份合计 ≈ 1.5 TiB / 64 GiB，
#   可用 H3_VLLM_MEM_LIMIT / H3_VLLM_MEMSWAP_LIMIT / H3_VLLM_MEM_RESERVATION 覆盖。
#   单实例操作：docker compose up -d minimax-h3-1 / docker compose restart minimax-h3-1
#
# 选 vLLM 的原因：LightX2V 的 8 个 Diffusers 布局 artifact 在 vLLM-Omni 官方支持表里，
# 走 --lora-backend peft，请求级激活，不需要离线融合；DLO 与 request-switchable
# LoRA 可以同时使用。Ref2VA 文件必须配 --task-type ref2va（不能挂到 combined/FL2VA 服务）。
#
# 版本：随 base 一起升到 v0.32.0rc1（复用 Dockerfile.vllm 产出的镜像，不新建镜像）。
# 依据（0.31 镜像内核对过，两版契约一致）：vllm_omni/diffusion/models/minimax_h3/lora.py 已带
#   _TURBO_NAME_RE（fl2v|ref2v）、768p 的 flow_shift=6、alpha 从 safetensors
#   metadata 读，以及请求级 lora 字段 / --lora-backend peft / --dlo-resident-layers。
# 0.32 额外去掉 LoRA rebind（vLLM-Omni #7195）；若升级后出片异常，把 image 换回
# minimax-h3-vllm:v0.31.0rc1 即可回滚（见 docs/HANDOFF-4-variants.md §7.1）。
#
# 镜像重建（仅当本机没有该 tag）：在仓库根目录
#   docker build -f Dockerfile.vllm -t minimax-h3-vllm:v0.32.0rc1 .
#
# 使用的 artifact（Ref2VA, 8 步）：
#   minimax_h3_ref2v_turbo_8step_v1.0_768p_bf16.safetensors
# 下载：
#   hf download lightx2v/Minimax-h3-Turbo \
#     minimax_h3_ref2v_turbo_8step_v1.0_768p_bf16.safetensors \
#     --local-dir /model_nas/models/lightx2v-turbo
#
# ⚠️ 文件名就是契约：不要改名、不要用 _comfyui_ 导出（QKV 融合版会被按名字拒绝）、
#    目录里只放这一个文件（多文件会被判歧义拒绝）。
#
# 请求契约（/v1/videos/sync 或异步 /v1/videos）：
#   num_inference_steps=9, flow_shift=6, audio_flow_shift=3.0,
#   extra_params={"task":"ref2va","duration":5,...}
#   lora={"name":"h3-turbo-ref2v-8step",
#         "path":"/models/turbo/minimax_h3_ref2v_turbo_8step_v1.0_768p_bf16.safetensors",
#         "scale":1.0}
#   path 必须是服务端看到的路径；步数/shift/文件名不匹配会被拒绝。
#
# A100 40G 适配：DLO resident=24 是带 LoRA 常驻缓冲的保守值。
#   实测峰值有余量再 28 -> 32；出现 OOM 先回退 20/16。
#
# 并行拓扑：官方示例是 8 卡纯 Ulysses，TP2+LoRA 没有公开实测。本机 base H3
#   在 TP2+DLO 上已验证，先沿用；如果 LoRA 在 TP 下报错或显存尖峰，改
#   --tensor-parallel-size 1 --usp 2 --text-encoder-tp-size 1（vae 并行度保持 2）。
#
# attention backend：官方 recipe 在 B300 用 TRTLLM_ATTN；A100 上本仓库已验证
#   的是 CUDNN_ATTN（base H3 用了很久），H3 是 packed varlen，FLASH_ATTN 这条
#   路径没在本机验证过。先跟已验证值对齐，要试更快再单独开实验。

# ───────────────────────────────────────────────────────────────────────────
# 公共片段（4 个实例共享定义）：镜像、内存、命令、挂载、环境变量、健康检查
# 容器内端口固定 8000 —— 4 个实例的 command / healthcheck 完全一致，
# 只有宿主端口与 GPU 对写在各自的 service 上。
# ───────────────────────────────────────────────────────────────────────────
x-turbo-common: &turbo-common
  # 复用根目录 Dockerfile.vllm 产出的 tag（与 base 服务同一份代码，只差命令行），
  # 所以这里没有 build: 段；需要重建时走上面的 docker build。
  image: minimax-h3-vllm:v0.32.0rc1

  ipc: host
  shm_size: 64gb           # ipc: host 时 /dev/shm 即宿主机 shm，本项不生效，保留仅为兼容

  restart: unless-stopped

  # RAM + SWAP <= 400G，swap 硬上限 16G（每实例）
  mem_limit: ${H3_VLLM_MEM_LIMIT:-384g}
  memswap_limit: ${H3_VLLM_MEMSWAP_LIMIT:-400g}
  mem_swappiness: 10
  mem_reservation: ${H3_VLLM_MEM_RESERVATION:-256g}

  command:
    - vllm
    - serve
    - /models/MiniMax-H3
    - --omni
    - --task-type
    - ref2va
    - --host
    - 0.0.0.0
    - --port
    - "8000"                     # 容器内固定端口；宿主端口见各 service 的 ports
    - --trust-remote-code
    - --served-model-name
    - MiniMaxAI/MiniMax-H3

    - --num-gpus
    - "2"
    - --tensor-parallel-size
    - "2"
    - --usp
    - "1"
    - --ring
    - "1"

    - --text-encoder-tp-size
    - "2"
    - --vae-patch-parallel-size
    - "2"
    - --vae-parallel-mode
    - tile
    - --vae-use-tiling

    - --enable-distributed-layerwise-offload
    - --dlo-no-use-allgather
    - --dlo-resident-layers
    - "24"

    - --enforce-eager
    # 与仓库验证过的 A100 base H3 一致；不要直接换成 TRTLLM_ATTN（需 SM90+）
    - --diffusion-attention-backend
    - CUDNN_ATTN

    - --lora-backend
    - peft
    - --lora-path
    - /models/turbo/minimax_h3_ref2v_turbo_8step_v1.0_768p_bf16.safetensors

  volumes:
    - /model_nas/models/MiniMax-H3:/models/MiniMax-H3:ro
    - /model_nas/models/lightx2v-turbo:/models/turbo:ro
    - /data/minimax-h3:/data/minimax-h3:ro

  environment:
    - VLLM_WORKER_MULTIPROC_METHOD=spawn
    - VLLM_OMNI_VIDEO_SYNC_TIMEOUT=14400
    - HF_HUB_OFFLINE=1
    - WIDTH=1344
    - HEIGHT=768

  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
    interval: 300s
    timeout: 10s
    retries: 2
    # 首启要从 /model_nas 拉 ~62GB 主干 + LoRA 再建 DLO，NAS 慢时 10 分钟不够；
    # start_period 只影响健康判定，不影响启动。
    start_period: 1800s

services:
  # ══ 实例 0：GPU 0,1 → 宿主 :8010 ═══════════════════════════════════════════
  minimax-h3-0:
    <<: *turbo-common
    container_name: minimax-h3-turbo-ref2va-0

    ports:
      - "8010:8000"

    deploy:
      resources:
        reservations:
          memory: ${H3_VLLM_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              # 必须写字符串：本机 Compose 5.6.0 对整数直接校验失败
              device_ids: ["0", "1"]
              capabilities: [gpu]

  # ══ 实例 1：GPU 2,3 → 宿主 :8011 ═══════════════════════════════════════════
  minimax-h3-1:
    <<: *turbo-common
    container_name: minimax-h3-turbo-ref2va-1

    ports:
      - "8011:8000"

    deploy:
      resources:
        reservations:
          memory: ${H3_VLLM_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              device_ids: ["2", "3"]
              capabilities: [gpu]

  # ══ 实例 2：GPU 4,5 → 宿主 :8012 ═══════════════════════════════════════════
  minimax-h3-2:
    <<: *turbo-common
    container_name: minimax-h3-turbo-ref2va-2

    ports:
      - "8012:8000"

    deploy:
      resources:
        reservations:
          memory: ${H3_VLLM_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              device_ids: ["4", "5"]
              capabilities: [gpu]

  # ══ 实例 3：GPU 6,7 → 宿主 :8013 ═══════════════════════════════════════════
  minimax-h3-3:
    <<: *turbo-common
    container_name: minimax-h3-turbo-ref2va-3

    ports:
      - "8013:8000"

    deploy:
      resources:
        reservations:
          memory: ${H3_VLLM_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              device_ids: ["6", "7"]
              capabilities: [gpu]
