# Pika-Labs/Pika-H3-Flex — SGLang（dev）—— 4 实例（每实例 TP2）
#
# ── 多实例（一进程一实例，一次起 4 个）──────────────────────────────────────
#   minimax-h3-0  GPU 0,1  →  http://<host>:30050
#   minimax-h3-1  GPU 2,3  →  http://<host>:30051
#   minimax-h3-2  GPU 4,5  →  http://<host>:30052
#   minimax-h3-3  GPU 6,7  →  http://<host>:30053
#   容器内一律监听 30010，实例差异只在宿主端口与 GPU 对。
#   宿主端口段 30050-30053 是本变体专用（base 30010-13 / PDD 30020-23 /
#   FastH3-V2 30030-33 / VDN 30040-43 / Omni-SGLang 30060-63）。
#   宿主机 RAM/SWAP 是「每实例」一份：默认 384g/386g；8×A100/768GiB 机器上
#   4 份名义上限 1.5TiB，实际层卸载常驻 ~134GiB/实例，用 H3_SGL_MEM_LIMIT 等下调。
#   ⚠️ 4 实例共用 HF cache 与 overlay cache（首启要拉 base + 适配器）。首次部署
#      先单起实例 0 完成预热，再 up -d 拉起其余，避免并发写同一份 cache。
#
# 选 SGLang 的原因：vLLM-Omni 全树 0 次提到 Pika，**不支持**；SGLang 一等支持
# （PR #47378，2026-10-31）。但 Pika 晚于 v0.5.23 的 release 切点，任何已发布 tag
# 都没有它 → 本服务用 video-sglang:dev（见 images/Dockerfile.sglang-dev）。
# 等 v0.5.24 发布后把镜像与 FROM 换成定版 tag。
#
# 能力边界：FL2VA + Ref2VA 两个适配器；本服务用 --model-variant ref2va 只服务 ref2va。
# 契约（PikaH3FlexSamplingParams / PipelineConfig）：
#   - 固定 6 步（knots 1000/750/500/250/100/40），请求 num_inference_steps 只接受 6；
#   - 适配器 trained shift 12/3，请求写别的 flow_shift/audio_flow_shift 会被拒；
#   - 适配器**保持不合并**（--lora-merge-mode dynamic；BF16 merge 会削掉约 1/3 更新量）；
#   - 不支持 quality:"high"（请求用默认 lossless 或 exact）；
#   - --lora-path 不能替换自带适配器。
#
# 权重（HF；Pika 适配器 + 链接 pinned base MiniMax-H3 组件，base 为 gated）：
#   HF_HOME=/model_nas/hf-cache HF_TOKEN=... hf download Pika-Labs/Pika-H3-Flex
#   HF_HOME=/model_nas/hf-cache HF_TOKEN=... hf download MiniMaxAI/MiniMax-H3
#   （overlay 只下 ~5.5GB 适配器并校验 sha256，其余链接 base；离线先预热同一 HF_HOME）
#
# 请求（异步 /v1/videos）：task=ref2va, num_inference_steps=6, 省略 shift 保持 12/3,
#   quality 默认 lossless（勿写 high）。参考素材数量/尺寸是 Ref2VA 墙钟主因，先治理素材。

x-pika-common: &pika-common
  image: video-sglang:dev
  build:
    context: ../images
    dockerfile: Dockerfile.sglang-dev

  ipc: host
  pid: host
  shm_size: 512gb

  restart: unless-stopped

  mem_limit: ${H3_SGL_MEM_LIMIT:-384g}
  memswap_limit: ${H3_SGL_MEMSWAP_LIMIT:-386g}
  mem_swappiness: 0
  mem_reservation: ${H3_SGL_MEM_RESERVATION:-256g}

  command:
    - sglang
    - serve
    - --model-path
    - Pika-Labs/Pika-H3-Flex
    - --model-variant
    - ref2va
    - --num-gpus
    - "2"
    - --tp-size
    - "2"
    - --ulysses-degree
    - "1"
    # FP32 适配器保持未合并：BF16 merge 会按 auto 的 50% 阈值削掉约 1/3 更新量。
    # 不传时 PikaH3FlexPipelineConfig 也会自动设 dynamic，这里显式写出以示意图。
    - --lora-merge-mode
    - dynamic
    - --performance-mode
    - memory
    - --layerwise-offload-components
    - dit,text_encoder,vae
    - --dit-offload-prefetch-size
    - "1"
    - --dit-layerwise-resident-layers
    - "24"
    - --enable-torch-compile
    - "false"
    - --warmup-resolutions
    - 1344x768
    - --warmup-num-frames
    - "124"
    # RPC 超时：不传 --scheduler-rpc-timeout，走默认 None（不设 transport 层超时），
    # 避免长 Ref2VA 任务在 3h 处被标 failed；异常挂起由脚本侧超时/人工兜底。
    - --host
    - 0.0.0.0
    - --port
    - "30010"

  volumes:
    # HF cache 承载 Pika 适配器 + 链接的 base 组件 + overlay 产物
    - /model_nas/hf-cache:/hf-cache:rw
    - /data/minimax-h3:/data/minimax-h3:ro

  environment:
    - HF_HOME=/hf-cache
    - HF_TOKEN=${HF_TOKEN:-}
    - SGLANG_DIFFUSION_CACHE_ROOT=/hf-cache/sglang-pika
    - SGLANG_HEALTH_CHECK_TIMEOUT=120

  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:30010/health').status==200 else 1)"]
    interval: 300s
    timeout: 30s
    retries: 2
    # 首启要拉 gated base + 适配器并校验 sha256；给足 30min（只影响健康判定，不重启）
    start_period: 1800s

services:
  minimax-h3-0:
    <<: *pika-common
    container_name: minimax-h3-pika-0
    ports:
      - "30050:30010"
    deploy:
      resources:
        reservations:
          memory: ${H3_SGL_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              # 必须写字符串：本机 Compose 5.6.x 对整数直接校验失败
              device_ids: ["0", "1"]
              capabilities: [gpu]

  minimax-h3-1:
    <<: *pika-common
    container_name: minimax-h3-pika-1
    ports:
      - "30051:30010"
    deploy:
      resources:
        reservations:
          memory: ${H3_SGL_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              device_ids: ["2", "3"]
              capabilities: [gpu]

  minimax-h3-2:
    <<: *pika-common
    container_name: minimax-h3-pika-2
    ports:
      - "30052:30010"
    deploy:
      resources:
        reservations:
          memory: ${H3_SGL_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              device_ids: ["4", "5"]
              capabilities: [gpu]

  minimax-h3-3:
    <<: *pika-common
    container_name: minimax-h3-pika-3
    ports:
      - "30053:30010"
    deploy:
      resources:
        reservations:
          memory: ${H3_SGL_MEM_RESERVATION:-256g}
          devices:
            - driver: nvidia
              device_ids: ["6", "7"]
              capabilities: [gpu]
